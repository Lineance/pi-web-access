name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # A release tagged v0.7.0 must not publish 0.8.0 from package.json.
      - name: Verify the release tag matches package.json
        if: github.event_name == 'release'
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const tag = process.env.TAG.replace(/^v/, "");
            const version = JSON.parse(readFileSync("package.json", "utf8")).version;
            if (tag !== version) {
              console.error(`tag ${tag} does not match package.json ${version}`);
              process.exit(1);
            }
            console.log(`publishing ${version}`);
          '
        env:
          TAG: ${{ github.event.release.tag_name }}

      - run: npm run build
      - run: npm run pack:check

      # prepublishOnly runs typecheck, lint, test, build and smoke again, so a
      # failing suite cannot reach the registry.
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
